name: APK bauen und Release veröffentlichen

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle ausführbar machen
        run: chmod +x gradlew

      - name: Unit-Tests ausführen
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: weinregal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: GitHub Release mit APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          name: Weinregal ${{ github.ref_name }}
          body: |
            Automatisch gebaute Debug-APK aus Commit ${{ github.sha }}.

            Installation: APK herunterladen und auf dem Smartphone öffnen
            (Installation aus unbekannten Quellen erlauben).
